api_platform:
    # API operations are discovered by iikiti.api_list and dispatched through
    # the three wrapper tools; never export each resource operation as an MCP tool.
    mcp:
        enabled: false

    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        security: "is_granted('IS_AUTHENTICATED_FULLY') or request.getMethod() in ['GET', 'HEAD']"
