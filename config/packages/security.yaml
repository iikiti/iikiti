security:
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    access_decision_manager:
        strategy: unanimous
        allow_if_all_abstain: false
    providers:
        user:
            entity:
                class: iikiti\CMS\Entity\Object\User
    password_hashers:
        iikiti\CMS\Entity\Object\User:
            algorithm: auto
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api_login:
            pattern: ^/api/auth/login$
            provider: user
            context: main
            stateless: false
            form_login:
                login_path: html_login
                check_path: api_auth_login
                failure_path: html_login
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: mfa_challenge
            entry_point: form_login
        mfa_session:
            pattern: ^/api/auth/mfa/
            provider: user
            context: main
            stateless: false
        interactive_forms:
            pattern: ^/api/forms/
            provider: user
            context: main
            stateless: false
            form_login:
                login_path: html_login
                check_path: api_auth_login
                failure_path: html_login
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: mfa_challenge
            entry_point: form_login
        public_site_assets:
            pattern: ^/api/public/sites/[^/]+/assets/
            provider: user
            context: main
            stateless: false
        session_api_token:
            pattern: ^/api/auth/session-token$
            provider: user
            context: main
            stateless: false
        api_logout:
            pattern: ^/api/auth/logout$
            provider: user
            context: main
            stateless: false
            logout:
                path: html_logout
                target: /
        api:
            pattern: ^/api
            stateless: true
            custom_authenticators:
                - iikiti\CMS\Security\ApiTokenAuthenticator
        main:
            provider: user
            lazy: true
            form_login:
                login_path: html_login
                check_path: api_auth_login
                failure_path: html_login
                enable_csrf: true
                csrf_token_id: authenticate
                default_target_path: mfa_challenge
            entry_point: form_login
            access_denied_handler: iikiti\CMS\Security\AccessHandler

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true
    role_hierarchy:
        # Core role chain (explicit inheritance)
        ROLE_NON_MEMBER: []
        ROLE_USER: [ROLE_NON_MEMBER]
        ROLE_MEMBER: [ROLE_USER]
        ROLE_AUTHOR: [ROLE_MEMBER]
        ROLE_EDITOR: [ROLE_AUTHOR]
        ROLE_MANAGER: [ROLE_EDITOR]
        ROLE_SITE_MANAGER: [ROLE_MANAGER]
        ROLE_ADMIN: [ROLE_SITE_MANAGER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]
        ROLE_SYSTEM: [ROLE_SUPER_ADMIN]

        # Wildcard patterns (Symfony 8.2 native) — pattern keys grant parent
        # roles to any matching dynamic or database-defined role.
        'ROLE_*': [ROLE_USER]
        'ROLE_PLUGIN_*': [ROLE_ADMIN]
        'ROLE_SITE_*': [ROLE_SITE_MANAGER]
        'ROLE_CONTENT_*': [ROLE_EDITOR]
        'ROLE_MOD_*': [ROLE_MODERATOR]
        'ROLE_BLOG_*': [ROLE_BLOG_READER]
        'ROLE_*_MODERATOR': [ROLE_MODERATOR]
        'ROLE_MEMBER_*': [ROLE_MEMBER]
        'ROLE_AUTHOR_*': [ROLE_AUTHOR]
        'ROLE_EDITOR_*': [ROLE_EDITOR]
        'ROLE_MANAGER_*': [ROLE_MANAGER]
        'ROLE_USER_*': [ROLE_USER]

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/mfa/, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/session-token$, roles: PUBLIC_ACCESS }
        - { path: ^/api/forms/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/mfa, roles: PUBLIC_ACCESS }
        - { path: ^/forms, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/, roles: PUBLIC_ACCESS }
