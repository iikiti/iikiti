parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    iikiti\CMS\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Filters/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'
            # Query builder value objects and expressions are plain objects
            # instantiated directly by the builder, not services.
            - '../src/Query/'
            - '../src/ORM/'

    # Services excluded from auto-registration live under src/Query/ and
    # src/ORM/. Their constructor arguments are resolved via PHP attributes
    # (#[Autowire], #[AutowireIterator]) so only their service IDs are needed here.

    iikiti\CMS\Query\DatabasePlatform\DatabasePlatformRegistry: ~

    iikiti\CMS\Query\QueryBuilderFactory: ~

    # PostgreSQLPlatformStrategy implements DatabasePlatformStrategyInterface
    # which carries #[AutoconfigureTag('iikiti.query.database_platform')].
    # The tag is re-declared here because the class is excluded from
    # auto-registration.
    iikiti\CMS\Query\DatabasePlatform\PostgreSQL\PostgreSQLPlatformStrategy:
        tags:
            - { name: iikiti.query.database_platform }

    # PostgreSQLSearchEngine implements SearchEngineInterface which carries
    # #[AutoconfigureTag('iikiti.search_engine')]. The tag is re-declared here
    # explicitly so the default PostgreSQL engine is always registered, even if
    # auto-registration settings change.
    iikiti\CMS\Search\Strategy\PostgreSQL\PostgreSQLSearchEngine:
        tags:
            - { name: iikiti.search_engine }

    # SearchEngineInterface aliased to the default PostgreSQL implementation
    # for direct DI injection where a specific engine is not required.
    iikiti\CMS\Search\Strategy\SearchEngineInterface:
        alias: iikiti\CMS\Search\Strategy\PostgreSQL\PostgreSQLSearchEngine

    # Collection extension must run after pagination (priority -64) so the
    # paginator takes precedence for paginated collections.
    iikiti\CMS\Cache\ApiPlatform\ApiPlatformCacheCollectionExtension:
        autoconfigure: false
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection, priority: -100 }

    # Symfony Profiler panel for the database query caching layer. Registered
    # for all environments; it is only rendered where the web profiler is
    # enabled (dev/test).
    iikiti\CMS\Profiler\DatabaseCacheDataCollector:
        tags:
            - { name: data_collector, id: 'iikiti.database_cache', template: 'bundles/Profiler/cache_database.html.twig' }

    # Aliases
    iikiti\CMS\Workflow\WorkflowFactoryInterface:
        alias: iikiti\CMS\Workflow\WorkflowFactory

    iikiti\CMS\Authentication\Mail\MfaCodeMailerInterface:
        alias: iikiti\CMS\Authentication\Mail\MfaCodeMailer

    iikiti\CMS\Query\DatabasePlatform\DatabasePlatformStrategyInterface:
        alias: iikiti\CMS\Query\DatabasePlatform\PostgreSQL\PostgreSQLPlatformStrategy

    # Auto-tag any service implementing AdminExtensionInterface so plugins
    # can contribute admin menu items by simply implementing the interface.
    _instanceof:
        iikiti\CMS\Admin\AdminExtensionInterface:
            tags: ['iikiti.admin.extension']

    # Security services that may be accessed directly by plugins
    iikiti\CMS\Security\PermissionChecker:
        public: true
    iikiti\CMS\Audit\AuditLogger:
        public: true
