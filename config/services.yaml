parameters:
    application_role_default: api
    application_role: '%env(default:application_role_default:APPLICATION_ROLE)%'
    public_page_render_via_api_default: false
    public_page_render_via_api: '%env(bool:default:public_page_render_via_api_default:PUBLIC_PAGE_RENDER_VIA_API)%'
    internal_api_resolve_default: '{}'
    internal_api_resolve: '%env(json:default:internal_api_resolve_default:INTERNAL_API_RESOLVE)%'
    digital_asset_storage_dir: '%kernel.project_dir%/var/digital-assets'
    scheduler_adapter_default: symfony
    scheduler_adapter_key: '%env(default:scheduler_adapter_default:SCHEDULER_ADAPTER)%'
    lazy_queue_enabled_default: true
    lazy_queue_enabled: '%env(bool:default:lazy_queue_enabled_default:LAZY_QUEUE_ENABLED)%'
    background_runner_cooldown_default: 5
    background_runner_cooldown_seconds: '%env(int:default:background_runner_cooldown_default:BACKGROUND_RUNNER_COOLDOWN_SECONDS)%'
    background_runner_max_messages_default: 5
    background_runner_max_messages: '%env(int:default:background_runner_max_messages_default:BACKGROUND_RUNNER_MAX_MESSAGES)%'
    background_runner_time_limit_default: 2
    background_runner_time_limit_seconds: '%env(float:default:background_runner_time_limit_default:BACKGROUND_RUNNER_TIME_LIMIT_SECONDS)%'
    background_runner_excluded_receivers_default: 'failed'
    background_runner_excluded_receivers: '%env(csv:default:background_runner_excluded_receivers_default:BACKGROUND_RUNNER_EXCLUDED_RECEIVERS)%'
    firewall_max_inspection_bytes_default: 8388608
    firewall_max_inspection_bytes: '%env(int:default:firewall_max_inspection_bytes_default:FIREWALL_MAX_INSPECTION_BYTES)%'
    firewall_max_uploads_default: 20
    firewall_max_uploads: '%env(int:default:firewall_max_uploads_default:FIREWALL_MAX_UPLOADS)%'
    firewall_max_inspection_milliseconds_default: 5000
    firewall_max_inspection_milliseconds: '%env(int:default:firewall_max_inspection_milliseconds_default:FIREWALL_MAX_INSPECTION_MILLISECONDS)%'
    iikiti_security_firewall_pack_directory: '%kernel.project_dir%/var/firewall/rule-packs'
    iikiti_firewall_ruleset_ttl: 300
    secrets_keyring_default: '{}'
    secrets_active_key_id_default: ''
    secrets_keyring: '%env(json:default:secrets_keyring_default:SECRETS_KEYRING)%'
    secrets_active_key_id: '%env(default:secrets_active_key_id_default:SECRETS_ACTIVE_KEY_ID)%'
    transfer_credentials_keyring_default: '{}'
    transfer_credentials_active_key_id_default: ''
    transfer_credentials_allow_legacy_default: false
    transfer_credentials_keyring: '%env(json:default:transfer_credentials_keyring_default:TRANSFER_CREDENTIALS_KEYRING)%'
    transfer_credentials_active_key_id: '%env(default:transfer_credentials_active_key_id_default:TRANSFER_CREDENTIALS_ACTIVE_KEY_ID)%'
    transfer_credentials_allow_legacy: '%env(bool:default:transfer_credentials_allow_legacy_default:TRANSFER_CREDENTIALS_ALLOW_LEGACY)%'
    guest_api_token_keyring_default: '{}'
    guest_api_token_active_key_id_default: ''
    guest_api_token_allow_legacy_default: false
    guest_api_token_keyring: '%env(json:default:guest_api_token_keyring_default:GUEST_API_TOKEN_KEYRING)%'
    guest_api_token_active_key_id: '%env(default:guest_api_token_active_key_id_default:GUEST_API_TOKEN_ACTIVE_KEY_ID)%'
    guest_api_token_allow_legacy: '%env(bool:default:guest_api_token_allow_legacy_default:GUEST_API_TOKEN_ALLOW_LEGACY)%'
    widget_fragment_hmac_key_default: ''
    widget_fragment_hmac_key: '%env(base64:default:widget_fragment_hmac_key_default:WIDGET_FRAGMENT_HMAC_KEY)%'
    mcp_http_enabled_default: false
    mcp_allowed_hosts_default: 'localhost,127.0.0.1,iikiti.localhost'
    mcp_api_max_request_bytes_default: 1048576
    mcp_api_max_response_bytes_default: 131072
    mcp_api_max_page_size_default: 200
    mcp_api_rate_limit_default: 120
    mcp_http_enabled: '%env(bool:default:mcp_http_enabled_default:MCP_ENABLED)%'
    mcp_allowed_hosts: '%env(csv:default:mcp_allowed_hosts_default:MCP_ALLOWED_HOSTS)%'
    mcp_api_max_request_bytes: '%env(int:default:mcp_api_max_request_bytes_default:MCP_API_MAX_REQUEST_BYTES)%'
    mcp_api_max_response_bytes: '%env(int:default:mcp_api_max_response_bytes_default:MCP_API_MAX_RESPONSE_BYTES)%'
    mcp_api_max_page_size: '%env(int:default:mcp_api_max_page_size_default:MCP_API_MAX_PAGE_SIZE)%'
    mcp_api_rate_limit: '%env(int:default:mcp_api_rate_limit_default:MCP_API_RATE_LIMIT)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    iikiti\CMS\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Filters/'
            - '../src/Profiler/ProfilerQueryDiagnostics.php'
            - '../src/Profiler/ProfilerQueryDiagnosticsSubscriber.php'
            - '../src/Profiler/RemoteDoctrineDataCollector.php'
            - '../src/Profiler/RemoteAwareDoctrineDataCollector.php'
            - '../src/Crypto/ApplicationKeyring.php'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'
            # Query builder value objects and expressions are plain objects
            # instantiated directly by the builder, not services.
            - '../src/Query/'
            - '../src/ORM/'

    iikiti\CMS\Service\AssetStorage:
        arguments:
            $directory: '%env(default:digital_asset_storage_dir:DIGITAL_ASSET_STORAGE_DIRECTORY)%'

    iikiti\CMS\Security\Firewall\FirewallRequestContextFactory:
        arguments:
            $maxInspectionBytes: '%firewall_max_inspection_bytes%'
            $maxFiles: '%firewall_max_uploads%'
            $maxInspectionMilliseconds: '%firewall_max_inspection_milliseconds%'

    # Services excluded from auto-registration live under src/Query/ and
    # src/ORM/. Their constructor arguments are resolved via PHP attributes
    # (#[Autowire], #[AutowireIterator]) so only their service IDs are needed here.

    iikiti\CMS\Query\DatabasePlatform\DatabasePlatformRegistry: ~

    iikiti\CMS\Query\QueryBuilderFactory: ~

    # PostgreSQLPlatformStrategy implements DatabasePlatformStrategyInterface
    # which carries #[AutoconfigureTag('iikiti.query.database_platform')].
    # The tag is re-declared here because the class is excluded from
    # auto-registration.
    iikiti\CMS\Query\DatabasePlatform\PostgreSQL\PostgreSQLPlatformStrategy:
        tags:
            - { name: iikiti.query.database_platform }

    # PostgreSQLSearchEngine implements SearchEngineInterface which carries
    # #[AutoconfigureTag('iikiti.search_engine')]. The tag is re-declared here
    # explicitly so the default PostgreSQL engine is always registered, even if
    # auto-registration settings change.
    iikiti\CMS\Search\Strategy\PostgreSQL\PostgreSQLSearchEngine:
        tags:
            - { name: iikiti.search_engine }

    # SearchEngineInterface aliased to the default PostgreSQL implementation
    # for direct DI injection where a specific engine is not required.
    iikiti\CMS\Search\Strategy\SearchEngineInterface:
        alias: iikiti\CMS\Search\Strategy\PostgreSQL\PostgreSQLSearchEngine

    # Collection extension must run after pagination (priority -64) so the
    # paginator takes precedence for paginated collections.
    iikiti\CMS\Cache\ApiPlatform\ApiPlatformCacheCollectionExtension:
        autoconfigure: false
        tags:
            - { name: api_platform.doctrine.orm.query_extension.collection, priority: -100 }

    iikiti\CMS\Serializer\DbObjectSecretNormalizer:
        autoconfigure: false
        tags:
            - { name: serializer.normalizer, priority: 100 }

    iikiti\CMS\Serializer\DbObjectLocaleNormalizer:
        autoconfigure: false
        tags:
            - { name: serializer.normalizer, priority: 90 }

    # Database query-cache diagnostics. Registered via the iikiti\CMS\: resource
    # above and auto-wired; it is auto-tagged `data_collector` because it
    # implements DataCollectorInterface. It carries NO `template` tag, so
    # Symfony's TemplateManager renders no profiler tab for it — its data is
    # surfaced inside the built-in Cache panel via
    # profile.getCollector('iikiti.database_cache') (getName()). dev/test only.
    iikiti\CMS\Profiler\DatabaseCacheDataCollector: ~

    iikiti\CMS\Profiler\AsyncResponseDataCollector: ~

    # Tabless collector; its safe request snapshot is rendered inside Security.
    # Subscribe to firewall events only where the profiler is enabled.
    iikiti\CMS\Profiler\FirewallDataCollector:
        autoconfigure: false

    # Aliases
    iikiti\CMS\Workflow\WorkflowFactoryInterface:
        alias: iikiti\CMS\Workflow\WorkflowFactory

    iikiti\CMS\Authentication\Mail\MfaCodeMailerInterface:
        alias: iikiti\CMS\Authentication\Mail\MfaCodeMailer

    iikiti\CMS\Query\DatabasePlatform\DatabasePlatformStrategyInterface:
        alias: iikiti\CMS\Query\DatabasePlatform\PostgreSQL\PostgreSQLPlatformStrategy

    iikiti\CMS\Web\BlockEditor\Usage\BlockUsageIndexInterface:
        alias: iikiti\CMS\Web\BlockEditor\Usage\BlockUsageIndexer

    # Auto-tag block editor extensibility interfaces so plugins (and core) register
    # block types / embed providers / query sources / save workflows / transports
    # simply by implementing the interface.
    _instanceof:
        iikiti\CMS\Admin\AdminExtensionInterface:
            tags: ['iikiti.admin.extension']
        iikiti\CMS\Web\BlockEditor\BlockType\BlockTypeInterface:
            tags: ['iikiti.cms.block_type']
        iikiti\CMS\Plugin\ObjectPropertyDefinitionProviderInterface:
            tags: ['iikiti.cms.object_property_definition']
        iikiti\CMS\Web\BlockEditor\Embed\EmbedProviderInterface:
            tags: ['iikiti.cms.embed_provider']
        iikiti\CMS\Web\BlockEditor\Query\QuerySourceInterface:
            tags: ['iikiti.cms.query_source']
        iikiti\CMS\Web\Template\TemplateRuleInterface:
            tags: ['iikiti.cms.template_rule']
        iikiti\CMS\Web\BlockEditor\Workflow\SaveWorkflowInterface:
            tags: ['iikiti.cms.save_workflow']
        iikiti\CMS\Web\BlockEditor\Collaboration\CollaborationTransportInterface:
            tags: ['iikiti.cms.collaboration_transport']
        iikiti\CMS\Service\DigitalAssetProcessorInterface:
            tags: ['iikiti.digital_asset_processor']
        iikiti\CMS\Batch\BatchMessageHandlerInterface:
            tags: ['iikiti.batch.message_handler']
        iikiti\CMS\Batch\ScheduledTaskProviderInterface:
            tags: ['iikiti.scheduled_task_provider']
        iikiti\CMS\Scheduler\SchedulerAdapterInterface:
            tags: ['iikiti.scheduler_adapter']

    iikiti\CMS\Scheduler\SchedulerAdapterRegistry:
        arguments:
            $selected: '%scheduler_adapter_key%'

    iikiti\CMS\Transfer\SiteTransferManifestStore:
        arguments:
            $directory: '%kernel.project_dir%/var/site-transfers'

    iikiti\CMS\Transfer\SiteTransferCredentialVault:
        arguments:
            $applicationSecret: '%kernel.secret%'
            $keyring: '@iikiti\CMS\Crypto\TransferCredentialKeyring'
            $allowLegacyCiphertext: '%transfer_credentials_allow_legacy%'

    iikiti\CMS\Crypto\TransferCredentialKeyring:
        arguments:
            $encodedKeys: '%transfer_credentials_keyring%'
            $activeKeyId: '%transfer_credentials_active_key_id%'

    iikiti\CMS\Crypto\GuestApiTokenKeyring:
        arguments:
            $encodedKeys: '%guest_api_token_keyring%'
            $activeKeyId: '%guest_api_token_active_key_id%'

    iikiti\CMS\Security\GuestApiTokenManager:
        arguments:
            $legacySecret: '%kernel.secret%'
            $keyring: '@iikiti\CMS\Crypto\GuestApiTokenKeyring'
            $allowLegacyTokens: '%guest_api_token_allow_legacy%'

    iikiti\CMS\Web\BlockEditor\Render\WidgetFragmentPlanner:
        arguments:
            $secret: '%widget_fragment_hmac_key%'

    iikiti\CMS\Secrets\SecretsKeyring:
        arguments:
            $encodedKeys: '%secrets_keyring%'
            $activeKeyId: '%secrets_active_key_id%'

    # EmbedResolver + ObjectsQuerySource cache via the database-backed pool.
    iikiti\CMS\Web\BlockEditor\Embed\EmbedResolver:
        arguments:
            $cache: '@cache.database'

    iikiti\CMS\Web\BlockEditor\Query\ObjectsQuerySource:
        arguments:
            $cache: '@cache.database'

    # Icon block: the bundled Lucide set is the default IconSet. Plugins may
    # alias this interface to a different set.
    iikiti\CMS\Web\Icon\IconSet: '@iikiti\CMS\Web\Icon\LucideIconSet'

    # Security services that may be accessed directly by plugins
    iikiti\CMS\Security\PermissionChecker:
        public: true
    iikiti\CMS\Secrets\SecretsApi:
        public: true
    iikiti\CMS\Audit\AuditLogger:
        public: true
    iikiti\CMS\Audit\AuditRecorder:
        public: true
    iikiti\CMS\Audit\AuditContext:
        public: true

    iikiti\CMS\Audit\AuditRequestListener:
        autowire: true
        autoconfigure: true

when@dev:
    services:
        iikiti\CMS\Profiler\ProfilerQueryDiagnostics:
            autowire: true
            arguments:
                $applicationSecret: '%kernel.secret%'

        iikiti\CMS\Profiler\RemoteDoctrineDataCollector:
            autowire: true
            autoconfigure: true
            tags:
                - { name: data_collector, id: iikiti.remote_doctrine }

        data_collector.doctrine:
            class: iikiti\CMS\Profiler\RemoteAwareDoctrineDataCollector
            arguments:
                $registry: '@doctrine'
                $remoteQueries: '@iikiti\CMS\Profiler\RemoteDoctrineDataCollector'
                $shouldValidateSchema: true
                $debugDataHolder: '@doctrine.debug_data_holder'
                $secondLevelCacheManagers: []
            tags:
                - { name: data_collector, template: '@Doctrine/Collector/db.html.twig', id: db, priority: 250 }

        iikiti\CMS\Profiler\ProfilerQueryDiagnosticsSubscriber:
            autowire: true
            autoconfigure: true
            arguments:
                $debugDataHolder: '@doctrine.debug_data_holder'
                $profiler: '@profiler'
            tags:
                - { name: kernel.event_subscriber }

        iikiti\CMS\Api\BusinessApiClient:
            autowire: true
            arguments:
                $symfonyProfiler: '@profiler'

        iikiti\CMS\Profiler\FirewallDataCollector:
            tags:
                - { name: data_collector, id: iikiti.firewall }
                - { name: kernel.event_subscriber }

when@test:
    services:
        iikiti\CMS\Profiler\FirewallDataCollector:
            tags:
                - { name: data_collector, id: iikiti.firewall }
                - { name: kernel.event_subscriber }
